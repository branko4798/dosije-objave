name: Objavi
on:
  schedule:
    # GitHub zakazana pokretanja kasne ili ih preskače (najviše oko punog sata), zato
    # gusto, na „neparne" minute, 19:07–23:57 Beograd. publish.py objavljuje tek kad je
    # objava dospela i nikad dvaput.
    - cron: "7,17,27,37,47,57 17-21 * * *"   # 19h Beograd = 17 UTC leti, 18 UTC zimi
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Proba bez objave (1 = da)"
        default: "1"
      only_id:
        description: "Objavi baš ovu objavu (npr. k12), prazno = sledeća dospela"
        default: ""
permissions:
  contents: write
concurrency: objavi
jobs:
  objavi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }   # najnoviji posted.json, ne stanje iz trenutka okidanja
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python publish.py
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          ONLY_ID: ${{ github.event.inputs.only_id || '' }}
      - if: always()
        run: |
          git config user.name "dosije-objave"; git config user.email "actions@users.noreply.github.com"
          git add posted.json 2>/dev/null && git commit -qm "Objavljeno $(date -u +%F)" || exit 0
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done; exit 1
